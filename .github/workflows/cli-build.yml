name: CLI build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cli-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux x86_64
            os: ubuntu-24.04
            binary: repowitness
            asset_suffix: linux-x86_64
          - name: macOS arm64
            os: macos-14
            binary: repowitness
            asset_suffix: macos-arm64
          - name: Windows x86_64
            os: windows-2025
            binary: repowitness.exe
            asset_suffix: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact RepoWitness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the Rust toolchain
        run: |
          set -Eeuo pipefail
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Build the release CLI
        run: cargo build --release --locked -p repowitness-cli --bin repowitness

      - name: Smoke-test the release CLI
        run: |
          set -Eeuo pipefail
          binary="./target/release/${{ matrix.target.binary }}"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Package the Unix release CLI
        if: runner.os != 'Windows'
        run: |
          set -Eeuo pipefail
          install -d -m 0755 dist
          tar -C target/release -czf \
            "dist/repowitness-${GITHUB_REF_NAME}-${{ matrix.target.asset_suffix }}.tar.gz" \
            "${{ matrix.target.binary }}"

      - name: Package the Windows release CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -LiteralPath "target/release/${{ matrix.target.binary }}" `
            -DestinationPath "dist/repowitness-$env:GITHUB_REF_NAME-${{ matrix.target.asset_suffix }}.zip"

      - name: Retain the release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repowitness-${{ github.ref_name }}-${{ matrix.target.asset_suffix }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: repowitness-${{ github.ref_name }}-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'repowitness-*' -print | sort)
          if [[ "${#archives[@]}" -ne 3 ]]; then
            echo "expected exactly three release archives" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" >dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RepoWitness $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
