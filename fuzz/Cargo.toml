[package]
name = "repowitness-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/mqasimca/repowitness"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
repowitness-local = { path = "../crates/repowitness-local" }
repowitness-mcp = { path = "../crates/repowitness-mcp" }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[[bin]]
name = "memory_record"
path = "fuzz_targets/memory_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phase1_inputs"
path = "fuzz_targets/phase1_inputs.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"
