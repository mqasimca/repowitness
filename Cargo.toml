[workspace]
members = [
    "crates/repowitness-analysis",
    "crates/repowitness-application",
    "crates/repowitness-cli",
    "crates/repowitness-domain",
    "crates/repowitness-local",
    "crates/repowitness-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/mqasimca/repowitness"
publish = false

[workspace.dependencies]
cap-fs-ext = { version = "=4.0.2", default-features = false, features = ["std"] }
cap-std = { version = "=4.0.2", default-features = false }
getrandom = { version = "=0.3.4", default-features = false }
gix = { version = "=0.86.0", default-features = false, features = ["index", "sha1", "sha256"] }
granit-parser = { version = "=0.0.7", default-features = false }
repowitness-analysis = { path = "crates/repowitness-analysis" }
repowitness-application = { path = "crates/repowitness-application" }
repowitness-domain = { path = "crates/repowitness-domain" }
repowitness-local = { path = "crates/repowitness-local" }
repowitness-mcp = { path = "crates/repowitness-mcp" }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled", "hooks"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
same-file = { version = "=1.0.6" }
schemars = { version = "=1.2.1", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde-saphyr = { version = "=0.0.29", default-features = false, features = ["deserialize"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2" }
sha2 = { version = "=0.11.0", default-features = false }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-std", "io-util", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = { version = "=0.26.11", default-features = false, features = ["std"] }
tree-sitter-go = { version = "=0.25.0" }
tree-sitter-python = { version = "=0.25.0" }
tree-sitter-rust = { version = "=0.24.2" }
tree-sitter-typescript = { version = "=0.23.2" }

[patch.crates-io]
tree-sitter-typescript = { path = "third_party/tree-sitter-typescript" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
